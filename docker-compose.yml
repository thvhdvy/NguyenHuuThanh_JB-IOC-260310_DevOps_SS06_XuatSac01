services:
  core-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=banking_db
    ports:
      - "5432:5432"
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d banking_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  account-service:
    build: ./banking-app
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://core-db:5432/banking_db
    ports:
      - "8080:8080"
    depends_on:
      core-db:
        condition: service_healthy
    restart: on-failure
    networks:
      - banking-network

  transaction-service:
    build: ./transaction-service
    environment:
      - ACCOUNT_SERVICE_URL=http://account-service:8080
    ports:
      - "8081:8081"
    depends_on:
      - account-service
    restart: on-failure
    networks:
      - banking-network
  
  api-gateway:
    build: ./api-gateway
    ports:
      - "80:80"
    depends_on:
      - account-service
      - transaction-service
    networks:
      - banking-network

networks:
  banking-network:
    driver: bridge
